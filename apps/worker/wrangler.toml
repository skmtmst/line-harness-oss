# Generated by create-line-harness. Safe to overwrite on future setup runs.
name = "nen-line"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# global_fetch_strictly_public: subrequest を公開インターネット経路に限定する
# (N-366 の strict-public 保証。外向き Webhook の配送境界の一部)。
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
account_id = "55f40f5577bd68828d67716f8d900642"

# 他社向けサービス用の本番APIドメイン。既存の workers.dev URL も併存して使える。
routes = [
  { pattern = "api.musubo.jp", custom_domain = true }
]

# Worker runs before static assets so bot UAs get OGP HTML injection;
# normal UAs fall through to the SPA via env.ASSETS.fetch().
[assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "nen-line"
database_id = "5b0fcea8-e05e-42bf-9efa-f2bc4c459552"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "nen-line-images"

[ai]
binding = "AI"

# バナー生成の用途寸法への整形（Cloudflare Images・R120）。
# R2 の `IMAGES` と名前が重なるため `CF_IMAGES` にしている。
# 注意: Images の有効化が必要か・変換回ごとの料金を、配備の前にオーナーへ確認する。
[images]
binding = "CF_IMAGES"

[triggers]
# :00/:05... は時刻厳守の通知・配信、:01/:06... は再実行可能な重い集計。
# 6時間処理も別 invocation にして、走査の遅延を通知へ波及させない。
crons = ["*/5 * * * *", "1-56/5 * * * *", "0 */6 * * *"]

[vars]
DEPLOY_ENV = "production"
RESTAURANT_TEST_ENABLED = "true"
# 実店舗のGoogleビジネスプロフィールへ、口コミ返信と投稿を本当に公開する。
# 利用者が2026-09-29に本番での公開を選んだため有効にした。
# 無効に戻すと、表示と下書きの保存はそのまま使えて、公開操作だけ403になる。
GOOGLE_BUSINESS_WRITE_ENABLED = "true"
WORKER_NAME = "nen-line"
ADMIN_PAGES_PROJECT = "nen-line-admin-98712679"
LIFF_PAGES_PROJECT = ""
D1_DATABASE_ID = "5b0fcea8-e05e-42bf-9efa-f2bc4c459552"
MANIFEST_URL = "https://github.com/Shudesu/line-harness-oss/releases/latest/download/release-manifest.json"
WORKER_PUBLIC_URL = "https://api.musubo.jp"
ADMIN_PUBLIC_URL = "https://admin.musubo.jp"
LIFF_PUBLIC_URL = "https://api.musubo.jp"
CF_ACCOUNT_ID = "55f40f5577bd68828d67716f8d900642"
MEDIA_R2_BUCKET_NAME = "nen-line-images"
NEN_EC_BASE_URL = "https://nen-petfood.com"
NEN_RICH_MENU_STORE_URL = "https://nen-petfood.com"
CONTACT_EMAIL = "contact-shed@nen-petfood.com"
XSERVER_MAIL_HOST = "sv12504.xserver.jp"
XSERVER_MAIL_USER = "contact-shed@nen-petfood.com"
XSERVER_RELAY_URL = "https://nen-petfood.com/_system/support-mail-relay.php"
