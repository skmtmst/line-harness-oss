<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ★V8 の書体: 英数字は Inter、日本語は Noto Sans JP。
      M2 の見た目の型：①はしっぽり明朝・③は Zen Maru Gothic を見出しに使う。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap"
    />
    <!-- お客さま向けの画面は検索に出さない（public/robots.txt・_headers と同じ）。 -->
    <meta name="robots" content="noindex, nofollow" />
    <title>musubo</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <!--
      LIFF の初期化（ログインの確かめ）が終わるまで React は描かない。その間を白い画面にしないよう、
      読み込み中の骨組み（LoadingView・板 AcTHQ と同じ形）を先に置く。React が描くと消える。
      0.3 秒以内に開けたら見えない（点滅させない）。
    -->
    <style>
      .boot{max-width:28rem;margin:0 auto;padding:60px 16px 0;opacity:0;animation:boot-in 0s linear .3s forwards}
      .boot i{display:block;border-radius:6px;background:#f1f3f5;margin-bottom:14px}
      .boot i.card{height:84px;border-radius:14px;background:#f7f8f9}
      @keyframes boot-in{to{opacity:1}}
      @media (prefers-reduced-motion:reduce){.boot{animation:none;opacity:1}}
    </style>
    <div id="root"><div class="boot" role="status" aria-busy="true" aria-label="読み込み中"><i style="height:24px"></i><i style="height:14px;width:200px;max-width:100%"></i><i class="card"></i><i class="card"></i><i class="card"></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
