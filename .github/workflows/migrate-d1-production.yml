name: Migrate D1 Production (release child)

on:
  workflow_call:
    inputs:
      operations_paused:
        type: boolean
        required: true
      release_sha:
        type: string
        required: true
      staging_run_id:
        type: string
        required: true
      approved_migrations:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.workflow_ref == format('{0}/.github/workflows/deploy-cloudflare-production.yml@refs/heads/main', github.repository)
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      OPERATIONS_PAUSED: ${{ inputs.operations_paused }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      STAGING_RUN_ID: ${{ inputs.staging_run_id }}
      APPROVED_MIGRATIONS: ${{ inputs.approved_migrations }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      SECURITY_WORKER_NAME: ${{ vars.WORKER_NAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release checkout before dependency installation
        shell: bash
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/deploy-cloudflare-production.yml@refs/heads/main"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main >/dev/null 2>&1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse FETCH_HEAD^{tree})"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Recheck release authorization before DB work
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/deploy/production/run.ts preflight
      - name: Check deployment security settings (read only)
        run: pnpm exec tsx scripts/security/run-deployment-safety.ts production apps/worker/wrangler.toml
      - name: Count pending D1 migrations (SELECT-only dry-run)
        run: pnpm exec tsx scripts/deploy/production/run.ts plan
      - name: Backup D1 privately and verify stored export before any write
        env:
          PRODUCTION_BACKUP_POLICY: ${{ secrets.PRODUCTION_BACKUP_POLICY }}
          PRODUCTION_BACKUP_KEY: ${{ secrets.PRODUCTION_BACKUP_KEY }}
        run: pnpm exec tsx scripts/deploy/production/run.ts backup
      - name: Recheck authorization immediately before applying approved SQL
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/deploy/production/run.ts preflight
      - name: Apply exactly the approved, unchanged D1 plan
        run: pnpm exec tsx scripts/deploy/production/run.ts apply
