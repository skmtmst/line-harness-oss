name: Required PR gate

# This workflow intentionally runs for every pull request. The final
# `required-pr-gate` job is the one stable branch-protection check; the
# expensive suites run in parallel behind it.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify and validate the change
    runs-on: ubuntu-latest
    outputs:
      full_suite: ${{ steps.scope.outputs.full_suite }}
      db_tests: ${{ steps.scope.outputs.db_tests }}
      docs_tests: ${{ steps.scope.outputs.docs_tests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Protect command-center owned documents
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "PR差分がない手動実行のため、司令塔の所有パス検査を飛ばします。"
            exit 0
          fi

          case "$HEAD_REF" in
            codex/kenta-r2-hq-*|codex/kenta-train-*)
              echo "司令塔の枝のため、所有パスの変更を許可します。"
              exit 0
              ;;
          esac

          protected_files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" \
            | grep -E '^(docs/brain/|docs/v6-requirements/|docs/v6-[^/]*\.md$|docs/v8-[^/]*\.md$|docs/v8-requirements/)' || true)
          if [ -n "$protected_files" ]; then
            echo "::error::司令塔の所有パスを変更しています。laneのPRから変更できません。"
            printf '%s\n' "$protected_files" | sed 's/^/    /'
            exit 1
          fi

          echo "司令塔の所有パスは変更されていません。"

      - name: Select the required test scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "full_suite=true" >> "$GITHUB_OUTPUT"
            echo "db_tests=true" >> "$GITHUB_OUTPUT"
            echo "docs_tests=true" >> "$GITHUB_OUTPUT"
            echo "PR差分がない手動実行のため、全検査を行います。"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          if grep -qE '^packages/db/(src/|test/|migrations/)' <<< "$changed"; then
            echo "db_tests=true" >> "$GITHUB_OUTPUT"
            echo "DBの実装・テスト・マイグレーション変更があるため、DBテストを行います。"
          else
            echo "db_tests=false" >> "$GITHUB_OUTPUT"
          fi

          full_suite=false
          if [ -n "$changed" ] && grep -qvE '^(docs/|\.github/|README\.md$|AGENTS\.md$)' <<< "$changed"; then
            full_suite=true
            echo "コードまたは設定の変更があるため、全検査を行います。"
          else
            echo "文書・ワークフローだけの変更のため、高速検査を行います。"
          fi
          echo "full_suite=$full_suite" >> "$GITHUB_OUTPUT"

          # apps/docs の試験は、画面の中身だけでなく
          # `.github/workflows/deploy-cloudflare-docs.yml` を読んで、配り先の枝と
          # 秘密の扱い（値を出さない・main へ配らない）を見張っている(#704)。
          # ワークフローだけを変えたPRは full_suite=false になり、いちばん効く場面で
          # 外れてしまうので、そこだけ別に見る。
          if [ "$full_suite" = "true" ] || grep -qE '^\.github/workflows/' <<< "$changed"; then
            echo "docs_tests=true" >> "$GITHUB_OUTPUT"
            echo "docs の試験を行います。"
          else
            echo "docs_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject whitespace errors in the PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            git diff --check
          fi

      # 反映履歴は「あとでまとめて書く」と必ず薄くなる。変更した本人が
      # 変更した直後に書くのが一番正確なので、PRの時点で見る。
      - name: Require a release-log entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "PRの差分が取れないため、この確認は飛ばします。"
            exit 0
          fi

          case "$PR_TITLE$PR_BODY" in
            *"[skip release-log]"*)
              echo "::notice::[skip release-log] があるため、反映履歴の確認を飛ばしました。"
              exit 0
              ;;
          esac

          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          if [ -z "$changed" ]; then
            echo "変更がありません。"
            exit 0
          fi

          legacy_added=$(git diff "$BASE_SHA...$HEAD_SHA" \
            -- docs/release-log/unreleased.md \
            | grep '^+[-*] ' || true)
          if [ -n "$legacy_added" ]; then
            echo "::error::旧 docs/release-log/unreleased.md へ反映履歴を追加できません。"
            echo "docs/release-log/unreleased/<PR番号>-<担当>-<内容>.md を作ってください。"
            printf '%s\n' "$legacy_added" | sed 's/^+/    /'
            exit 1
          fi

          release_files=$(git diff --diff-filter=AM --name-only "$BASE_SHA...$HEAD_SHA" \
            -- 'docs/release-log/unreleased/*.md')
          while IFS= read -r release_file; do
            [ -n "$release_file" ] || continue
            invalid_headings=$(grep -nE '^#{1,6}[[:space:]]' "$release_file" \
              | grep -vE '^[0-9]+:## (追加|変更|修正)$' || true)
            if [ -n "$invalid_headings" ]; then
              echo "::error file=${release_file}::反映履歴の見出しは「追加」「変更」「修正」だけです。"
              printf '%s\n' "$invalid_headings" | sed 's/^/    /'
              exit 1
            fi
            if ! grep -qE '^## (追加|変更|修正)$' "$release_file"; then
              echo "::error file=${release_file}::反映履歴に「追加」「変更」「修正」の見出しがありません。"
              exit 1
            fi
          done <<EOF
          $release_files
          EOF

          if ! printf '%s\n' "$changed" | grep -qvE '^(docs/|\.github/|README\.md$|AGENTS\.md$)'; then
            echo "文書・ワークフローだけの変更のため、反映履歴の確認を飛ばしました。"
            exit 0
          fi

          added_lines=$(git diff "$BASE_SHA...$HEAD_SHA" \
            -- 'docs/release-log/unreleased/*.md' \
            | grep '^+[-*] ' || true)
          added=$(printf '%s' "$added_lines" | grep -c '^+' || true)
          if [ "$added" -gt 0 ]; then
            echo "反映履歴に $added 行足されています。"
            own=$(printf '%s\n' "$added_lines" | grep -c "#${PR_NUMBER}\b" || true)
            if [ "$own" -eq 0 ]; then
              echo "::error::反映履歴に、このPRの番号 #${PR_NUMBER} が入った行がありません。"
              echo "足した行のどれかに #${PR_NUMBER} を入れてください。"
              printf '%s\n' "$added_lines" | sed 's/^+/    /'
              exit 1
            fi
            echo "うち $own 行に #${PR_NUMBER} が入っています。"
            exit 0
          fi

          echo "::error::反映履歴に1行も足されていません。"
          echo "docs/release-log/unreleased/<PR番号>-<担当>-<内容>.md に1行書いてください。"
          exit 1

      - name: Check shell syntax
        run: |
          failed=0
          while IFS= read -r script; do
            echo "bash -n $script"
            bash -n "$script" || failed=1
          done < <(find scripts -name '*.sh' -type f)
          exit "$failed"

      - name: Check workflow YAML and run-step shell syntax
        run: |
          python3 -m pip install --quiet 'pyyaml==6.0.2'
          python3 - <<'PY'
          import glob
          import os
          import re
          import subprocess
          import sys
          import tempfile

          import yaml

          failed = False
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  with open(path, encoding='utf-8') as source:
                      document = yaml.safe_load(source)
              except Exception as exc:
                  print(f'[NG] {path}: YAML parse failed: {exc}')
                  failed = True
                  continue

              print(f'[OK] {path}: YAML parsed')
              for job in (document.get('jobs') or {}).values():
                  for step in (job.get('steps') or []):
                      script = step.get('run')
                      if not script:
                          continue
                      script = re.sub(r'\$\{\{[^}]*\}\}', 'GH_EXPR', script)
                      with tempfile.NamedTemporaryFile(
                          'w', suffix='.sh', delete=False, encoding='utf-8'
                      ) as handle:
                          handle.write(script)
                          temporary_path = handle.name
                      result = subprocess.run(
                          ['bash', '-n', temporary_path],
                          capture_output=True,
                          text=True,
                      )
                      os.unlink(temporary_path)
                      if result.returncode != 0:
                          name = step.get('name', '(unnamed step)')
                          print(f'[NG] {path} / {name}: {result.stderr.strip()}')
                          failed = True

          sys.exit(1 if failed else 0)
          PY
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/security/test_production_workflows.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/security/check_production_workflows.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/security/test_workflow_commands.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/security/check_workflow_commands.py

      - name: Lint production release workflows
        run: bash scripts/security/lint-production-workflows.sh

  repository-checks:
    name: Repository and shared checks
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard shared pattern ownership
        env:
          PATTERN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PATTERN_BASE_SHA" ]; then
            node scripts/visual-qa/v8-pattern-audit.mjs \
              --code . --base "$PATTERN_BASE_SHA" --out "$RUNNER_TEMP/pattern-ownership"
          else
            node scripts/visual-qa/v8-pattern-audit.mjs \
              --code . --out "$RUNNER_TEMP/pattern-ownership"
          fi
      - name: Guard newly added source visual contracts
        env:
          SOURCE_CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --test scripts/verify-no-source-visual-contracts.test.mjs scripts/source-provenance.test.mjs
          base="${SOURCE_CONTRACT_BASE_SHA:-$(git rev-parse HEAD^)}"
          node scripts/verify-no-source-visual-contracts.mjs --base "$base"
      - name: Build shared packages
        run: >-
          pnpm
          --filter @line-crm/shared
          --filter @line-crm/line-sdk
          --filter @line-crm/db
          --filter @line-harness/update-engine
          build
      - run: pnpm --filter @line-crm/db check:bootstrap
      # 追加のみ方針の静的検査(#742)。release.yml の tag push 時にも同じ
      # 検査が走るため、ここで落として次のリリースを止めない。
      - name: Migration safety check
        run: pnpm tsx scripts/check-migrations.ts
      - name: Test database package
        if: needs.changes.outputs.db_tests == 'true'
        run: pnpm --config.enable-pre-post-scripts=false --filter @line-crm/db test
      # 自己更新まわりの2つは release.yml のタグ push でしか動いていなかった。
      # 取り込んだ後、リリースを打つ段になって初めて失敗が分かる位置にあったので、
      # PRの必須ゲートへ引き上げる(#704)。この工程はすでに update-engine を
      # build しているので、依存の追加も待ち時間の追加もほぼない。
      - name: Test the self-update engine
        run: pnpm --filter @line-harness/update-engine test
      # Dependencies were built above; standalone package hooks remain enabled locally.
      - name: Test the setup CLI
        run: pnpm --config.enable-pre-post-scripts=false --filter create-line-harness test
      - run: pnpm test:scripts
      - name: Ratchet code quality against the PR base
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pnpm quality:test
          pnpm quality:typecheck
          base="${QUALITY_BASE_SHA:-$(git rev-parse HEAD^)}"
          pnpm quality:check --base "$base"
      - name: Check names and public dependency boundaries
        run: pnpm exec tsx scripts/structure/check.ts
      - name: Typecheck repository scripts
        run: pnpm typecheck:scripts
      - name: Test shared
        run: |
          pnpm --filter @line-crm/shared typecheck
          TZ=UTC pnpm --filter @line-crm/shared test
          TZ=Asia/Bangkok pnpm --filter @line-crm/shared test
      - run: pnpm --filter liff typecheck
      - run: pnpm --filter liff test

  worker-checks:
    name: Worker typecheck and tests
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Worker dependencies
        run: >-
          pnpm
          --filter @line-harness/sdk
          --filter @line-crm/shared
          --filter @line-crm/line-sdk
          --filter @line-crm/db
          build
      - run: pnpm --config.enable-pre-post-scripts=false --filter worker typecheck
      - run: pnpm --config.enable-pre-post-scripts=false --filter worker test

  worker-build:
    name: Worker build
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Worker dependencies
        run: >-
          pnpm
          --filter @line-crm/shared
          --filter @line-crm/line-sdk
          --filter @line-crm/db
          build
      - name: Build Worker
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_CALENDAR_CONNECTION_ID: ${{ vars.VITE_CALENDAR_CONNECTION_ID }}
        run: pnpm --config.enable-pre-post-scripts=false --filter worker build
      - name: Verify built production Worker config and security headers (offline)
        run: pnpm exec tsx scripts/deploy/production/check-build.ts worker
      - name: Install browser for deployed LIFF entry guard
        run: pnpm exec playwright install --with-deps chromium
      - name: Guard customer waitlist entry, theme and short actions
        run: node scripts/browser/liff-recovery.mjs
      - name: Verify LIFF security headers and public SDK compatibility
        run: node scripts/security/browser-headers.mjs worker

  web-checks:
    name: Admin lint, typecheck and tests
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://nen-line-stg.skmtmst.workers.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Admin dependencies
        run: |
          pnpm --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-harness/update-engine build
          pnpm --filter web release-log
      - run: pnpm --filter web exec next lint --report-unused-disable-directives-severity error
      - run: node apps/web/scripts/verify-entity-pickers.mjs
      - name: Reject restored legacy admin appearance
        run: node apps/web/scripts/verify-v8-only.mjs
      - run: pnpm --config.enable-pre-post-scripts=false --filter web typecheck
      - run: pnpm --config.enable-pre-post-scripts=false --filter web test
      # 外部連携画面の実挙動契約(webhook-runtime.spec.ts)。PR #1506 で入ったが
      # 専用の設定が無く、**どのワークフローからも一度も呼ばれていなかった**(#704)。
      # #704 で繋いだところ2試験が落ち、原因が画面側の不具合だと分かったので
      # (#705)、直したうえでここで繋ぎ直す。
      #
      # この試験だけは、書き出した `out` ではなく `next dev` に当てる。試験が
      # `/api/line-accounts` を `route.fetch()` で実際に取りに行くので、
      # `NEXT_PUBLIC_API_URL` に検証環境を焼き込んだ `out` には当てられない。
      # 設定側が画面確認用のモックAPIと `next dev` の両方を起こす。
      #
      # `web-build` ではなくこの工程に置くのは、`web-build` が
      # `apps/web/.next/cache` を持ち越しているから。あちらで `next dev` を
      # 動かすと、開発用の中間物が入った `.next/cache` を保存してしまい、
      # #696 と同じ「ソースと合わない cache による偽の失敗」を招く。
      # この工程は `next build` をしないので `.next` を汚さない。
      - name: Install Chromium for the webhook runtime contract
        run: pnpm exec playwright install --with-deps chromium
      - name: Webhook screen runtime contract on a real browser (#704, #705)
        run: |
          webhook_ports="$(node --input-type=module -e '
            import { createServer } from "node:net";
            const servers = [createServer(), createServer()];
            await Promise.all(servers.map(server => new Promise((resolve, reject) => {
              server.once("error", reject);
              server.listen(0, "127.0.0.1", resolve);
            })));
            console.log(servers.map(server => server.address().port).join(" "));
            await Promise.all(servers.map(server => new Promise(resolve => server.close(resolve))));
          ')"
          read -r webhook_api_port webhook_web_port <<< "$webhook_ports"
          WEBHOOK_RUNTIME_API_PORT="$webhook_api_port" WEBHOOK_RUNTIME_PORT="$webhook_web_port" \
            pnpm exec playwright test --config apps/web/src/app/webhooks/webhook-runtime.config.mjs
      # 失敗したときのDOMを残す。#705 は「吹き出しが次の行のボタンを覆う」という
      # 見た目の重なりで、後から読めないと原因に辿り着けない種類の失敗だった。
      - name: Upload webhook runtime contract failure context
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webhook-runtime-failure
          path: apps/web/test-results/
          retention-days: 7

  mcp-checks:
    name: MCP contract tests, typecheck and build
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build MCP dependencies
        run: pnpm --filter @line-harness/sdk build
      # sdk の 11ファイル53試験は、release.yml にも無く**どのCIからも動いて
      # いなかった**(#704)。この工程がすでに sdk を build しているので、
      # ここで続けて動かすのが一番安い。
      - name: Test the SDK
        run: pnpm --filter @line-harness/sdk test
      - run: pnpm --config.enable-pre-post-scripts=false --filter @line-harness/mcp-server typecheck
      - run: pnpm --config.enable-pre-post-scripts=false --filter @line-harness/mcp-server test
      - run: pnpm --filter @line-harness/mcp-server build

  # apps/docs の2ファイル6試験は、`deploy-cloudflare-docs.yml` が呼ぶのが
  # `test:export`（別のスクリプト）だったため、`vitest run` の `test` はどこからも
  # 動いていなかった(#704)。しかもそのワークフローは `codex/development` への
  # push でしか走らず、PRでは走らない。
  #
  # 他の3つと違って専用の工程を立てるのは、**走らせたい条件が違う**から。
  # `deploy-workflow.test.ts` は `.github/workflows/deploy-cloudflare-docs.yml`
  # 自体を読んで秘密の扱いを見張っており、ワークフローだけを変えたPR
  # （＝full_suite が false になるPR）でこそ効く。他の工程に相乗りさせると
  # その場面で外れる。中身は node と yaml だけなので、依存の build は要らない。
  docs-checks:
    name: Docs site tests
    needs: changes
    if: needs.changes.outputs.docs_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter docs test

  web-build:
    name: Admin build and design verification
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://nen-line-stg.skmtmst.workers.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # restore-keys でロックファイルのハッシュだけ一致させると、ソースが
      # まったく違う古い .next/cache を復元してしまい、Next.js の webpack
      # 永続キャッシュが古い成果物を混入させて偽の失敗を招く(#696)。
      # 完全一致のときだけキャッシュを使う。
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
      - run: pnpm install --frozen-lockfile
      - name: Build Admin dependencies
        # web prebuild builds shared and line-sdk and prepares the release log.
        run: pnpm --filter @line-harness/update-engine build
      - run: pnpm --filter web build
      - name: Verify exported Admin headers and all external bootstrap scripts (offline)
        run: pnpm exec tsx scripts/deploy/production/check-build.ts admin
      # 画面の権限は「文字列がある」では確かめられない。書き出した `out` を
      # 本番と同じ当て方で配り、実ブラウザで owner/admin/staff を動かす（N-197）。
      # vitest は `.test.ts(x)` しか見ないので、ここから呼ばないと必須ゲートの
      # 外に落ちる。同じChromiumを、LINE通知画面の実ブラウザ検査（#678）でも使う。
      - name: Install Chromium for the browser behavior tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify media permissions on the built admin
        run: >-
          pnpm exec playwright test
          --config apps/web/src/app/contents/contents-permission-behavior.config.mjs
      # EC取込一覧のアカウント切替・再試行競合(#685)。文字列一致では逆変異を
      # 検知できないため、実ブラウザ試験をここから呼ぶ(司令塔独立審査の差し戻し)。
      - name: Verify EC import list account-switch behavior on the built admin
        run: >-
          pnpm exec playwright test
          --config scripts/browser/ec-commerce-isolated.config.mjs
      # 間欠的な失敗(#685)の原因切り分け用。失敗時のDOM(error-context.md)を
      # artifactとして残し、CIでしか再現しない症状を後から読めるようにする。
      - name: Upload EC import list failure context
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ec-commerce-issue-685-failure
          path: apps/web/test-results/
          retention-days: 7
      - name: LINE notifications real-browser behavior (#678)
        run: node apps/web/src/app/line-notifications/line-notifications-browser-behavior.mjs
      # 保管済み(archived)タグの編集は名前・説明だけ許す(#710)。文字列一致
      # では「通常編集フォームが本当に出ない」を検知できないため、書き出した
      # `out` を実ブラウザで開いて確かめる。vitest は `.test.ts(x)` しか
      # 見ないので、ここから呼ばないと必須ゲートの外に落ちる。
      - name: Verify archived tag edit behavior on the built admin
        run: >-
          pnpm exec playwright test
          --config apps/web/src/components/friend-fields/tag-archived-edit.config.mjs
      - name: MFA auth input and button behavior at three widths
        run: pnpm exec playwright test --config scripts/browser/auth-isolated.config.mjs
      - name: Verify admin security headers and auth interactions
        run: node scripts/security/browser-headers.mjs web
      - name: Upload MFA browser failure context
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: train30-mfa-browser-failure
          path: apps/web/test-results/train30-mfa/
          retention-days: 7
      - run: pnpm --filter web verify:design
      # 画面の実挙動は、書き出した本番と同じ中身をブラウザで押して見る。
      # 型と文字列の検査だけでは、押せない口や取り違えた導線が残る。
      - name: Admin browser behavior checks
        run: |
          node apps/web/src/app/form-submissions/form-submissions-browser-behavior.mjs

  v8-screen-guard:
    name: V8 screen guard
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    # Check the current V8 screens at 1152, 1440 and 1920.
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8788
      NEXT_PUBLIC_RESTAURANT_TEST_ENABLED: 'true'
      NEXT_PUBLIC_GOOGLE_BUSINESS_ENABLED: 'true'
      V8_SPEED_ENFORCEMENT: ${{ vars.V8_SPEED_ENFORCEMENT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Decide whether to run the screen guard
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "compare=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "compare=true" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" \
            | grep -qE '^(apps/web/|packages/shared/|scripts/visual-qa/|pnpm-lock\.yaml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.scope.outputs.run == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build the PR admin against the visual-qa mock API
        if: steps.scope.outputs.run == 'true'
        run: |
          pnpm --filter @line-harness/update-engine build
          pnpm --filter web build
          cp -a apps/web/out /tmp/head-out
      - name: Build the base admin against the same mock API
        if: steps.scope.outputs.run == 'true' && steps.scope.outputs.compare == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add /tmp/base "$BASE_SHA"
          cd /tmp/base
          pnpm install --frozen-lockfile
          pnpm --filter @line-harness/update-engine build
          pnpm --filter web build
      - name: Install Chromium for the V8 screen guard
        if: steps.scope.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Start the mock API and serve the built admin
        if: steps.scope.outputs.run == 'true'
        run: |
          node scripts/visual-qa/mock-api.mjs > /tmp/mock-api.log 2>&1 &
          node apps/web/scripts/v8-guard/serve-out.mjs /tmp/head-out 4310 > /tmp/serve-head.log 2>&1 &
          if [ "${{ steps.scope.outputs.compare }}" = "true" ]; then
            node apps/web/scripts/v8-guard/serve-out.mjs /tmp/base/apps/web/out 4311 > /tmp/serve-base.log 2>&1 &
          fi
          ready=false
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4310/friends > /dev/null \
              && curl -sf 'http://127.0.0.1:8788/api/friends?account_id=visual-qa-account' > /dev/null \
              && { [ "${{ steps.scope.outputs.compare }}" != "true" ] || curl -sf http://127.0.0.1:4311/friends > /dev/null; }; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            cat /tmp/mock-api.log /tmp/serve-head.log
            echo "::error::速度・画面検査のサーバーが起動しませんでした"
            exit 1
          fi
      - name: No V8 layout breaks at 1152, 1440 and 1920
        if: steps.scope.outputs.run == 'true'
        run: node apps/web/scripts/v8-guard/layout-overflow.mjs http://127.0.0.1:4310 /tmp/v8-guard/layout.json
      # 空白量は診断のみ。切れ・重なり・操作の遮断を必須で確認する。
      - name: Broken fixtures must fail the V8 layout guard
        if: steps.scope.outputs.run == 'true'
        env:
          V8_GUARD_BASE: http://127.0.0.1:4310
        run: |
          node apps/web/scripts/v8-guard/browser-host.mjs --test --test-concurrency=1 apps/web/scripts/v8-guard/layout-defects.test.mjs apps/web/scripts/v8-guard/create-footer-choices.test.mjs apps/web/scripts/v8-guard/shared-recipe-defaults.test.mjs apps/web/scripts/v8-guard/affixed-input-layout.test.mjs apps/web/scripts/v8-guard/list-toolbar-readable.test.mjs apps/web/scripts/v8-guard/action-row-narrow.test.mjs apps/web/scripts/v8-guard/button-content-width.test.mjs apps/web/scripts/v8-guard/automation-field-error.test.mjs apps/web/scripts/v8-guard/fix-patterns.test.mjs apps/web/scripts/v8-guard/owner-rules.test.mjs apps/web/scripts/v8-guard/pendec2-rules.test.mjs apps/web/scripts/v8-guard/b244-rules.test.mjs apps/web/scripts/v8-guard/dialog-layout.test.mjs apps/web/scripts/v8-guard/table-column-alignment.test.mjs apps/web/scripts/v8-guard/visual-state.test.mjs apps/web/scripts/v8-guard/bar-chart-layout.test.mjs apps/web/scripts/v8-guard/reservation-reading.test.mjs apps/web/scripts/v8-guard/input-retention.test.mjs apps/web/scripts/v8-guard/record-columns.test.mjs apps/web/scripts/v8-guard/drawer-layout.test.mjs apps/web/scripts/v8-guard/layout-overflow.test.mjs apps/web/scripts/v8-guard/form-rules.test.mjs apps/web/scripts/v8-guard/active-modal-audit.test.mjs
      - name: Narrow preview opens once and preserves form input
        if: steps.scope.outputs.run == 'true'
        run: node apps/web/scripts/v8-guard/browser-host.mjs --test --test-concurrency=1 apps/web/scripts/v8-guard/narrow-preview.test.mjs
      - name: Train 17 waitlist failure and inflow mouse regressions
        if: steps.scope.outputs.run == 'true'
        run: node apps/web/scripts/v8-guard/stgfix17-browser.mjs http://127.0.0.1:4310 /tmp/v8-guard/stgfix17
      - name: Booking preview date agrees through settings and preview tabs
        if: steps.scope.outputs.run == 'true'
        run: node apps/web/scripts/v8-guard/stgfix18-preview.mjs http://127.0.0.1:4310 /tmp/v8-guard/stgfix18-preview
      - name: No new V8 layout or owner-rule defects
        if: steps.scope.outputs.run == 'true'
        run: node apps/web/scripts/v8-guard/layout-defects.mjs http://127.0.0.1:4310 /tmp/v8-guard/defects.json --compare-url '${{ steps.scope.outputs.compare == 'true' && 'http://127.0.0.1:4311' || '' }}'
      - name: List row rules
        if: steps.scope.outputs.run == 'true'
        run: |
          node apps/web/scripts/list-row-audit.mjs
          node apps/web/scripts/v8-guard/list-row-audit.mjs http://127.0.0.1:4310 /tmp/v8-guard/list-rows.json
          node apps/web/scripts/v8-guard/list-skeleton-audit.mjs http://127.0.0.1:4310 /tmp/v8-guard/list-skeleton.json
      - name: Speed measurement and reference policy controls
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        run: node --test apps/web/scripts/v8-guard/mock-local.test.mjs apps/web/scripts/v8-guard/speed-budget.test.mjs apps/web/scripts/v8-guard/speed-check.test.mjs apps/web/scripts/v8-guard/perf3-targets.test.mjs apps/web/scripts/v8-guard/stgfix17-targets.test.mjs
      - name: Common V8 speed checks (11 scenes, five medians)
        id: speed_budget
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        env:
          V8_SPEED_PROFILE: ci
        run: pnpm qa:speed http://127.0.0.1:4310 /tmp/v8-guard/speed.json
      - name: Train 17 absolute targets
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        run: node apps/web/scripts/v8-guard/stgfix17-targets.mjs /tmp/v8-guard/speed.json
      - name: 2000 friends meet absolute speed targets
        id: stress_speed
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        env:
          V8_SPEED_PROFILE: ci
        run: node apps/web/scripts/v8-guard/stress-targets.mjs /tmp/v8-guard/speed.json
      - name: PERF-01 fixed list speed targets
        id: perf3_targets
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        run: node apps/web/scripts/v8-guard/perf3-targets.mjs /tmp/v8-guard/speed.json
      - name: Report speed reference results (including incomplete measurements)
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        env:
          SPEED_BUDGET_OUTCOME: ${{ steps.speed_budget.outcome }}
          STRESS_SPEED_OUTCOME: ${{ steps.stress_speed.outcome }}
          PERF3_TARGETS_OUTCOME: ${{ steps.perf3_targets.outcome }}
        run: node apps/web/scripts/v8-guard/speed-report.mjs /tmp/v8-guard/speed.json
      - name: Virtual table selection, keyboard and layout
        if: steps.scope.outputs.run == 'true'
        run: |
          node apps/web/scripts/v8-guard/browser-host.mjs --test --test-concurrency=1 scripts/visual-qa/friends-table-state.test.mjs
          node scripts/visual-qa/friends-table.browser.mjs http://127.0.0.1:4310 /tmp/v8-guard/stress-table
      - name: Upload V8 screen guard results
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v8-screen-guard
          path: |
            /tmp/v8-guard/
            /tmp/mock-api.log
            /tmp/serve-head.log
            /tmp/serve-base.log
          retention-days: 7

      - name: Upload separate speed diagnosis traces
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v8-speed-diagnosis
          path: /tmp/v8-guard/speed.json.diagnosis/
          if-no-files-found: ignore
          retention-days: 7

  required-pr-gate:
    name: required-pr-gate
    needs:
      - changes
      - repository-checks
      - worker-checks
      - worker-build
      - web-checks
      - web-build
      - mcp-checks
      - docs-checks
      - v8-screen-guard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REPOSITORY_RESULT: ${{ needs.repository-checks.result }}
          WORKER_CHECKS_RESULT: ${{ needs.worker-checks.result }}
          WORKER_BUILD_RESULT: ${{ needs.worker-build.result }}
          WEB_CHECKS_RESULT: ${{ needs.web-checks.result }}
          WEB_BUILD_RESULT: ${{ needs.web-build.result }}
          MCP_CHECKS_RESULT: ${{ needs.mcp-checks.result }}
          DOCS_CHECKS_RESULT: ${{ needs.docs-checks.result }}
          V8_SCREEN_GUARD_RESULT: ${{ needs.v8-screen-guard.result }}
        run: |
          failed=0
          for result in \
            "$CHANGES_RESULT" \
            "$REPOSITORY_RESULT" \
            "$WORKER_CHECKS_RESULT" \
            "$WORKER_BUILD_RESULT" \
            "$WEB_CHECKS_RESULT" \
            "$WEB_BUILD_RESULT" \
            "$MCP_CHECKS_RESULT" \
            "$DOCS_CHECKS_RESULT" \
            "$V8_SCREEN_GUARD_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::選択された検査に失敗または中断があります。"
            exit 1
          fi

          echo "required-pr-gate: 合格"
