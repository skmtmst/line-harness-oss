name: GitHub PR Slack Sync

# Codex hooks remain a supplemental progress feed. GitHub is the source of
# truth for PR creation, updates and completion. The 15-minute pass repairs a
# missed event without creating duplicate Slack threads or replies.

on:
  pull_request:
    branches:
      - codex/development
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
      - closed
  push:
    branches:
      - codex/development
  schedule:
    # Avoid the busy start of each quarter-hour, when scheduled workflows are
    # delayed more often. GitHub schedules run from the default branch.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: '手動テストで再照合するPR番号（空なら通常どおり全件）'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: github-pr-slack-sync
  cancel-in-progress: false

jobs:
  sync:
    # This kill switch keeps a merge inert until the staging Worker has the
    # reconciliation code and Masato deliberately enables external notices.
    if: >-
      vars.SLACK_PR_SYNC_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never execute code from a PR head while a relay secret is available.
      # For pull_request events, use the already trusted base revision.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Synchronize PR state to the staging Slack relay
        id: slack_sync
        # Slack is an operational visibility aid, not a code-quality gate.
        # Keep the failure visible in Actions, but never block a PR merge.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_SLACK_RELAY_SECRET: ${{ secrets.CODEX_SLACK_RELAY_SECRET }}
          CODEX_SLACK_RELAY_URL: https://nen-line-stg.skmtmst.workers.dev/api/integrations/codex-slack/events
          # PR #275 and earlier were audited/backfilled before this workflow.
          GITHUB_SLACK_SYNC_MIN_PR_NUMBER: '276'
          GITHUB_SLACK_SYNC_ONLY_PR_NUMBER: ${{ inputs.pr_number || '' }}
          GITHUB_SLACK_SYNC_CLOSED_LOOKBACK_HOURS: '72'
          GITHUB_SLACK_SYNC_EXCLUDED_LABELS: 'slack-sync-ignore'
          # Enable only after the staging Worker understands commandCenterOnly.
          GITHUB_SLACK_SYNC_DEDICATED_COMMAND_CENTER_ENABLED: ${{ vars.SLACK_COMMAND_CENTER_STRICT_ENABLED || 'false' }}
        run: >-
          node
          --disable-warning=ExperimentalWarning
          --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
          --experimental-strip-types
          scripts/github-slack-pr-sync.ts

      - name: Report an advisory Slack synchronization failure
        if: steps.slack_sync.outcome == 'failure'
        run: |
          echo "::warning::Slack同期に失敗しました。PRの必須チェックには影響しません。定期再照合または手動実行で再試行してください。"
          {
            echo "### Slack同期（参考チェック）"
            echo ""
            echo "Slackへの同期に失敗しましたが、コードのPRは停止しません。"
            echo "定期再照合または手動実行で再試行されます。"
          } >> "$GITHUB_STEP_SUMMARY"
