name: Migrate D1

# 手で走らせる D1 のマイグレーション。
#
# 本番は deploy-cloudflare-worker.yml が main への push で自動的に当てる。
# ここは、その前に検証環境（nen-line-stg）で先に試すための入口。
# 検証用のデプロイスクリプト（scripts/deploy/staging-deploy.sh）は
# マイグレーションを当てないので、これが無いと本番が初見になる。
#
# 既定は dry-run。実際に当てるには mode を apply にする。
# 手が滑って走らせても、何も変わらないようにしている。
#
# 当てる前に必ず Time Travel のブックマークを取る。追加のみのポリシーで
# down マイグレーションを書けないので、戻る手段はこれだけになる。

on:
  workflow_dispatch:
    inputs:
      operation:
        description: マイグレーション確認か、ステージング運用経路の確認か
        type: choice
        required: true
        default: migrate
        options:
          - migrate
          - verify-operational-path
      environment:
        description: どのデータベースに当てるか
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production
      mode:
        description: dry-run は当てずに一覧するだけ
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - apply

permissions:
  contents: read

jobs:
  migrate:
    if: inputs.operation == 'migrate'
    environment:
      name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # データベース名の決め方。
      #
      # 本番は秘密情報から取る（fork ごとに名前が違う）。
      # 検証は秘密情報があればそれ、無ければ wrangler.staging.toml から読む。
      # 検証用の名前をわざわざ秘密にする理由は無いので、設定を減らしている。
      - name: Resolve the database name
        id: db
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          D1_STAGING_DATABASE_NAME: ${{ secrets.D1_STAGING_DATABASE_NAME }}
        run: |
          if [ "$ENVIRONMENT" = "production" ]; then
            name="$D1_DATABASE_NAME"
            if [ -z "$name" ]; then
              echo "::error::secrets.D1_DATABASE_NAME が設定されていません"
              exit 1
            fi
          else
            name="$D1_STAGING_DATABASE_NAME"
            if [ -z "$name" ]; then
              name=$(grep -A4 'd1_databases' apps/worker/wrangler.staging.toml \
                | grep 'database_name' | head -1 | sed 's/.*= *"//; s/".*//')
            fi
            if [ -z "$name" ]; then
              echo "::error::検証用のデータベース名を決められませんでした"
              exit 1
            fi
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "対象: $name ($ENVIRONMENT)"

      - name: Check the credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      # まだ当たっていないファイルを数える。dry-run はここで終わる。
      - name: List the pending migrations
        id: pending
        env:
          DB_NAME: ${{ steps.db.outputs.name }}
        run: |
          pending_file="$RUNNER_TEMP/d1-pending-migrations.txt"
          : > "$pending_file"

          npx wrangler d1 execute "$DB_NAME" --remote --command \
            "CREATE TABLE IF NOT EXISTS _migrations (name TEXT PRIMARY KEY, applied_at TEXT NOT NULL)"

          applied=$(npx wrangler d1 execute "$DB_NAME" --remote \
            --command "SELECT name FROM _migrations" --json \
            | node -e "
              const d = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
              const rows = d[0]?.results ?? [];
              console.log(rows.map((r) => r.name).join('\n'));
            ")

          count=0
          for f in $(ls packages/db/migrations/*.sql | sort); do
            name=$(basename "$f")
            if ! printf '%s\n' "$applied" | grep -qxF "$name"; then
              printf '%s\n' "$f" >> "$pending_file"
              count=$((count + 1))
            fi
          done

          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "## 未適用のマイグレーション: ${count} 件"
            echo
            echo "対象: \`$DB_NAME\`"
            echo
            if [ "$count" -gt 0 ]; then
              echo '```'
              sed 's#^packages/db/migrations/##' "$pending_file"
              echo '```'
            else
              echo "すべて適用済みです。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 当てる前の復元点。down マイグレーションが書けない以上、
      # 戻る手段はこれだけ。取れなかったら止める。
      - name: Take a Time Travel bookmark
        if: inputs.mode == 'apply' && steps.pending.outputs.count != '0'
        env:
          DB_NAME: ${{ steps.db.outputs.name }}
        run: |
          raw=$(npx wrangler d1 time-travel info "$DB_NAME" --json)
          echo "$raw"

          bookmark=$(printf '%s' "$raw" | node -e "
            const text = require('fs').readFileSync('/dev/stdin', 'utf8');
            let found = '';
            try {
              const d = JSON.parse(text);
              found = d.bookmark ?? d.result?.bookmark ?? '';
            } catch {
              // wrangler が JSON 以外を混ぜることがあるので、拾えなければ次へ
            }
            if (!found) {
              const m = text.match(/[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{32}/i);
              found = m ? m[0] : '';
            }
            process.stdout.write(found);
          ")

          if [ -z "$bookmark" ]; then
            echo "::error::Time Travel のブックマークを取れませんでした。戻る先が無いので中止します。"
            exit 1
          fi

          {
            echo
            echo "## 復元点（Time Travel）"
            echo
            echo "戻すとき:"
            echo
            echo '```bash'
            echo "npx wrangler d1 time-travel restore $DB_NAME --bookmark=$bookmark"
            echo '```'
            echo
            echo "この時点まで巻き戻すので、当てたあとに入った友だち・"
            echo "メッセージ・予約も一緒に消えます。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the pending migrations
        id: apply
        if: inputs.mode == 'apply' && steps.pending.outputs.count != '0'
        env:
          DB_NAME: ${{ steps.db.outputs.name }}
        run: |
          bash scripts/deploy/apply-d1-migrations.sh \
            "$DB_NAME" "$RUNNER_TEMP/d1-pending-migrations.txt"

      - name: Say what happened
        if: always()
        env:
          MODE: ${{ inputs.mode }}
          COUNT: ${{ steps.pending.outputs.count }}
        run: |
          if [ "$MODE" != "apply" ]; then
            echo "dry-run です。何も当てていません。"
            echo "実際に当てるには mode を apply にして、もう一度実行してください。"
          elif [ "${COUNT:-0}" = "0" ]; then
            echo "未適用のものはありませんでした。"
          elif [ "${{ steps.apply.outcome }}" != "success" ]; then
            echo "マイグレーションは途中で停止しました。サマリーの停止位置と確認手順を見てください。"
          else
            echo "$COUNT 件を当てました。上のサマリーに復元点が出ています。"
          fi

  verify-operational-path:
    if: inputs.operation == 'verify-operational-path' && inputs.environment == 'staging' && github.ref == 'refs/heads/codex/development'
    environment:
      name: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERIFY_ENVIRONMENT: staging
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify D1, delivery batches, and notification rules
        run: |
          set -o pipefail
          pnpm tsx scripts/verify-staging-operational-path.ts \
            | tee "$RUNNER_TEMP/staging-verification.json"

      - name: Publish aggregate-only result
        if: always()
        run: |
          {
            echo '## ステージング運用経路の確認'
            echo
            if [ -s "$RUNNER_TEMP/staging-verification.json" ]; then
              echo '```json'
              tail -n 1 "$RUNNER_TEMP/staging-verification.json"
              echo '```'
            else
              echo '検証結果を生成できませんでした。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
