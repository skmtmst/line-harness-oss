name: Deploy Cloudflare Worker

on:
  workflow_call:
    inputs:
      operations_paused:
        type: boolean
        required: true
      release_sha:
        type: string
        required: true
      staging_run_id:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.workflow_ref == format('{0}/.github/workflows/deploy-cloudflare-production.yml@refs/heads/main', github.repository)
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      OPERATIONS_PAUSED: ${{ inputs.operations_paused }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      STAGING_RUN_ID: ${{ inputs.staging_run_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      SECURITY_WORKER_NAME: ${{ vars.WORKER_NAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release checkout before dependency installation
        shell: bash
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/deploy-cloudflare-production.yml@refs/heads/main"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main >/dev/null 2>&1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse FETCH_HEAD^{tree})"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/deploy/production/run.ts preflight
      - name: Check source deployment security settings (read only)
        run: pnpm exec tsx scripts/security/run-deployment-safety.ts production apps/worker/wrangler.toml
      - name: Refuse Worker deployment while any D1 migration is pending (read only)
        run: pnpm exec tsx scripts/deploy/production/run.ts no-pending
      - name: Build Worker and LIFF assets
        run: pnpm --filter worker build
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_CALENDAR_CONNECTION_ID: ${{ vars.VITE_CALENDAR_CONNECTION_ID }}
      - name: Verify worker build artifact and static security headers
        # Resolve dist/<environment>/wrangler.json from the canonical TOML name.
        # Verify compatibility_flags: nodejs_compat and global_fetch_strictly_public.
        run: pnpm exec tsx scripts/deploy/production/run.ts worker-artifact
      - name: Check generated deployment security settings (read only)
        run: pnpm exec tsx scripts/security/run-deployment-safety.ts production "apps/worker/$WORKER_DEPLOY_CONFIG"
      - name: Recheck release authorization immediately before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/deploy/production/run.ts preflight
      - name: Recheck D1 is fully applied (read only)
        run: pnpm exec tsx scripts/deploy/production/run.ts no-pending
      - name: Deploy to Cloudflare Workers
        run: pnpm exec tsx scripts/deploy/production/run.ts deploy-worker
      - name: Verify public Worker revision
        run: node scripts/deploy/verify-public-build.mjs https://api.musubo.jp "$RELEASE_SHA" - -
      - name: Verify HTML, static assets, JSON and error security headers
        run: pnpm exec tsx scripts/deploy/production/run.ts worker-responses
