name: Update from upstream

# 然-NEN- のブランチ運用に合わせた fork 側の調整。
#
# 本家の workflow は main を起点に main 宛て PR を作るが、この fork では
# codex/development が開発・検証の統合ブランチで、main は「検証合格後に
# 本番へ反映してよい確定版」として分けている。上流の取り込みを main に
# 入れると未検証の変更が本番相当ブランチへ直接入るため、起点も宛先も
# codex/development に揃える。
#
# この workflow は PR を作るところまでで、マージもデプロイもしない。
# 一次確認は kenta、最終確認・バックアップは masato が担当する。

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: write
  pull-requests: write

env:
  INTEGRATION_BRANCH: codex/development

jobs:
  update:
    if: github.repository != 'Shudesu/line-harness-oss'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # スケジュール実行では既定ブランチ (main) が checkout されるため、
          # 統合ブランチを明示する。
          ref: codex/development

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Shudesu/line-harness-oss.git
          git fetch upstream main

      - name: Detect upstream changes
        id: detect
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create update branch
        if: steps.detect.outputs.has_changes == 'true'
        id: branch
        run: |
          branch="upstream/update-$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Merge upstream/main
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          git merge --no-edit upstream/main

      - name: Push update branch
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          git push origin "${{ steps.branch.outputs.name }}"

      - name: Open pull request
        if: steps.detect.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base "$INTEGRATION_BRANCH" \
            --head "${{ steps.branch.outputs.name }}" \
            --title "chore: update from upstream" \
            --body-file - <<'EOS'
          本家 `Shudesu/line-harness-oss` の main を、この fork の統合ブランチ
          `codex/development` へ取り込む自動 PR です。

          ## 担当
          - 一次確認: kenta
          - 最終確認・バックアップ: masato

          ## 確認すること
          - [ ] 差分に本番設定・シークレット・意図しない設定変更が含まれていない
          - [ ] `packages/db/migrations` の採番が自分たちの追加分と衝突していない
          - [ ] 管理画面 UI の変更が既存の作業と競合していない
          - [ ] 必要なテスト・型検査・ビルドが通っている

          ## 注意
          - この PR はマージもデプロイも自動では行いません。
          - 検証環境への反映は `scripts/deploy/staging-deploy.sh` 経由で、
            デプロイロックを取得してから実施してください。
          - `main` への反映は、検証合格後に別途 masato の承認を得たうえで行います。
          EOS

      - name: No upstream changes
        if: steps.detect.outputs.has_changes == 'false'
        run: echo "Fork is already up to date with upstream/main."
