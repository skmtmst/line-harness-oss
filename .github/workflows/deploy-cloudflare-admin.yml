name: Deploy Cloudflare Admin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'packages/update-engine/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-cloudflare-admin.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository != 'Shudesu/line-harness-oss' && vars.LINE_HARNESS_CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    env:
      # Worker の本番設定と必ず一致させる。見張りとビルドで同じ値を使う。
      NEXT_PUBLIC_GOOGLE_BUSINESS_ENABLED: 'true'
      NEXT_PUBLIC_RESTAURANT_TEST_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check deployment security settings (read only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec tsx scripts/security/run-deployment-safety.ts production apps/worker/wrangler.toml
      - run: pnpm --filter @line-crm/shared --filter @line-harness/update-engine build

      - name: Capture build metadata
        id: build-meta
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build Admin Panel
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          APP_BUILD_TIME: ${{ steps.build-meta.outputs.build_time }}

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME || 'your-admin-name' }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$NEXT_PUBLIC_API_URL"
          npx wrangler pages deploy apps/web/out \
            --project-name="$PAGES_PROJECT_NAME" \
            --commit-message="deploy ${GITHUB_SHA}"
