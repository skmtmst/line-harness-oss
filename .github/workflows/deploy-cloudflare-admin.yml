name: Deploy Cloudflare Admin

on:
  workflow_call:
    inputs:
      operations_paused:
        type: boolean
        required: true
      release_sha:
        type: string
        required: true
      staging_run_id:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.workflow_ref == format('{0}/.github/workflows/deploy-cloudflare-production.yml@refs/heads/main', github.repository)
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPERATIONS_PAUSED: ${{ inputs.operations_paused }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      STAGING_RUN_ID: ${{ inputs.staging_run_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      SECURITY_WORKER_NAME: ${{ vars.WORKER_NAME }}
      PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_GOOGLE_BUSINESS_ENABLED: 'true'
      NEXT_PUBLIC_RESTAURANT_TEST_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release checkout before dependency installation
        shell: bash
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/deploy-cloudflare-production.yml@refs/heads/main"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main >/dev/null 2>&1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse FETCH_HEAD^{tree})"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/deploy/production/run.ts preflight
      - name: Check deployment security settings (read only)
        run: pnpm exec tsx scripts/security/run-deployment-safety.ts production apps/worker/wrangler.toml
      - run: pnpm --filter @line-crm/shared --filter @line-harness/update-engine build
      - name: Capture build metadata
        id: build-meta
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Build Admin Panel
        run: pnpm --filter web build
        env:
          APP_COMMIT_SHA: ${{ inputs.release_sha }}
          APP_BUILD_TIME: ${{ steps.build-meta.outputs.build_time }}
          NEXT_PUBLIC_API_URL: 'https://api.musubo.jp'
          NEXT_PUBLIC_TERMS_URL: 'https://musubo.jp/terms/'
          NEXT_PUBLIC_PRIVACY_URL: 'https://musubo.jp/privacy/'
          NEXT_PUBLIC_COMMERCE_LAW_URL: 'https://musubo.jp/legal/'
          NEXT_PUBLIC_CONTACT_URL: 'https://musubo.jp/contact/'
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      - name: Verify admin build headers and external bootstrap files
        run: pnpm exec tsx scripts/deploy/production/run.ts admin-artifact
      - name: Recheck release authorization immediately before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/deploy/production/run.ts preflight
      - name: Verify Worker source revision before Admin publication
        run: node scripts/deploy/verify-public-build.mjs https://api.musubo.jp "$RELEASE_SHA" - -
      - name: Deploy to Cloudflare Pages
        # publish.ts fixes --branch main --commit-hash "$RELEASE_SHA" and validates the built SHA.
        run: pnpm exec tsx scripts/deploy/production/run.ts deploy-admin
      - name: Verify canonical Pages deployment
        run: pnpm exec tsx scripts/deploy/production/run.ts pages
      - name: Verify public source revisions
        run: node scripts/deploy/verify-public-build.mjs https://api.musubo.jp "$RELEASE_SHA" https://admin.musubo.jp "$RELEASE_SHA"
      - name: Verify Admin HTML and static asset security headers
        run: pnpm exec tsx scripts/deploy/production/run.ts admin-responses
