name: Deploy Cloudflare Admin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'packages/update-engine/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-cloudflare-admin.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository != 'Shudesu/line-harness-oss' && vars.LINE_HARNESS_CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @line-crm/shared --filter @line-harness/update-engine build

      - name: Capture build metadata
        id: build-meta
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build Admin Panel
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          # NEXT_PUBLIC_* はビルド時に埋め込まれる。ここで渡さないと本番の会員登録・
          # パスワード再設定の Turnstile が出ず、「確認メールを送る」が押せなくなる。
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          # 'true' で左メニューの「Googleビジネス」と /restaurant-test 配下が表示される。
          # Googleの機密スコープ審査（デモ動画と実運用）のため有効にしている。
          # Worker側の RESTAURANT_TEST_ENABLED と必ず同じ値にする。片方だけ true だと
          # 画面はあるのにAPIが404、またはAPIはあるのに画面が無い状態になる。
          NEXT_PUBLIC_RESTAURANT_TEST_ENABLED: 'true'
          APP_BUILD_TIME: ${{ steps.build-meta.outputs.build_time }}

      - name: Check Turnstile site key was bundled
        run: |
          # 鍵が抜けたまま配ると登録画面が沈黙して壊れる。配る前に止める。
          test -n "${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}" \
            || { echo '::error::リポジトリ変数 NEXT_PUBLIC_TURNSTILE_SITE_KEY が未設定です。本番の会員登録が動きません'; exit 1; }
          grep -rq "${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}" apps/web/out \
            || { echo '::error::ビルド結果に Turnstile サイトキーが入っていません'; exit 1; }

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME || 'your-admin-name' }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$NEXT_PUBLIC_API_URL"
          npx wrangler pages deploy apps/web/out \
            --project-name="$PAGES_PROJECT_NAME" \
            --commit-message="deploy ${GITHUB_SHA}"
