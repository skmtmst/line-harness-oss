name: Migrate LINE Credentials

# Existing plaintext LINE credentials are encrypted in D1 without exposing the
# key to the workflow operator. Register the four named secrets separately in
# the staging and production GitHub Environments; never use repository values
# to copy credentials between environments.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which GitHub Environment and D1 database to use
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production
      mode:
        description: dry-run only counts pending accounts
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: line-credential-migration-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    # The production Environment must have required reviewers. GitHub pauses
    # this job before making its Environment secrets available.
    environment:
      name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install the committed dependency graph
        run: pnpm install --frozen-lockfile

      # This second gate keeps production apply disabled until Masato has
      # configured required reviewers on the production Environment and then
      # deliberately enables the Environment variable.
      - name: Require the production apply gate
        if: inputs.environment == 'production' && inputs.mode == 'apply'
        env:
          APPLY_ENABLED: ${{ vars.LINE_CREDENTIAL_MIGRATION_APPLY_ENABLED }}
        run: |
          if [ "$APPLY_ENABLED" != "true" ]; then
            echo "::error::production apply is disabled (1 gate is not enabled)"
            exit 1
          fi

      - name: Check required Environment secrets
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          LINE_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.LINE_CREDENTIAL_ENCRYPTION_KEY }}
        run: |
          missing=0
          [ -n "$CF_ACCOUNT_ID" ] || missing=$((missing + 1))
          [ -n "$D1_DATABASE_ID" ] || missing=$((missing + 1))
          [ -n "$CF_API_TOKEN" ] || missing=$((missing + 1))
          [ -n "$LINE_CREDENTIAL_ENCRYPTION_KEY" ] || missing=$((missing + 1))
          if [ "$missing" -ne 0 ]; then
            echo "::error::required Environment secrets missing: ${missing}"
            exit 1
          fi
          echo "requiredSecrets: 4" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the credential migration
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          LINE_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.LINE_CREDENTIAL_ENCRYPTION_KEY }}
          MIGRATION_MODE: ${{ inputs.mode }}
        run: |
          args=()
          if [ "$MIGRATION_MODE" = "apply" ]; then
            args+=(--apply)
          fi
          pnpm --silent exec tsx scripts/migrate-line-account-credentials.ts "${args[@]}"
