name: Verify staging operational path

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-operational-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/codex/development'
    environment:
      name: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERIFY_ENVIRONMENT: staging
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify D1, delivery batches, and notification rules
        run: pnpm tsx scripts/verify-staging-operational-path.ts | tee "$RUNNER_TEMP/staging-verification.json"

      - name: Publish aggregate-only result
        if: always()
        run: |
          {
            echo '## ステージング運用経路の確認'
            echo
            if [ -s "$RUNNER_TEMP/staging-verification.json" ]; then
              echo '```json'
              tail -n 1 "$RUNNER_TEMP/staging-verification.json"
              echo '```'
            else
              echo '検証結果を生成できませんでした。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
