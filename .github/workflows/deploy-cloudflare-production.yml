name: Deploy Cloudflare Production

# Only this parent can publish production. The lock covers DB through public verification.
on:
  workflow_dispatch:
    inputs:
      operations_paused:
        description: 'Operator confirmed reservation/notification pause and recovery plan'
        type: boolean
        required: true
        default: false
      release_sha:
        description: '40-character staging-verified SHA; must be in main with exactly the approved main tree'
        type: string
        required: true
      staging_run_id:
        description: 'Successful Deploy Cloudflare Staging run that verified this exact SHA'
        type: string
        required: true
      approved_migrations:
        description: 'Owner-approved ordered JSON [{"name":"NNN_name.sql","sha256":"64 hex"}]; [] for none'
        type: string
        required: true
        default: '[]'

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.repository != 'Shudesu/line-harness-oss' && vars.LINE_HARNESS_CLOUDFLARE_DEPLOY == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SECURITY_WORKER_NAME: ${{ vars.WORKER_NAME }}
      PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      OPERATIONS_PAUSED: ${{ inputs.operations_paused }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      STAGING_RUN_ID: ${{ inputs.staging_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release checkout before dependency installation
        shell: bash
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/deploy-cloudflare-production.yml@refs/heads/main"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main >/dev/null 2>&1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse FETCH_HEAD^{tree})"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify approved main, production reviewers, and staging source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/deploy/production/run.ts preflight

  database:
    needs: authorize
    uses: ./.github/workflows/migrate-d1-production.yml
    with:
      operations_paused: ${{ inputs.operations_paused }}
      release_sha: ${{ inputs.release_sha }}
      staging_run_id: ${{ inputs.staging_run_id }}
      approved_migrations: ${{ inputs.approved_migrations }}
    secrets: inherit

  worker:
    needs: database
    uses: ./.github/workflows/deploy-cloudflare-worker.yml
    with:
      operations_paused: ${{ inputs.operations_paused }}
      release_sha: ${{ inputs.release_sha }}
      staging_run_id: ${{ inputs.staging_run_id }}
    secrets: inherit

  admin:
    needs: worker
    uses: ./.github/workflows/deploy-cloudflare-admin.yml
    with:
      operations_paused: ${{ inputs.operations_paused }}
      release_sha: ${{ inputs.release_sha }}
      staging_run_id: ${{ inputs.staging_run_id }}
    secrets: inherit
