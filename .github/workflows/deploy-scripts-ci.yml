name: Deploy scripts CI

# Post-merge gate for the deploy tooling.
#
# Pull requests are checked once by required-pr-gate.yml. This workflow keeps
# the same checks on pushes to the integration and production branches without
# running them a second time on pull requests.

on:
  push:
    branches: [codex/development, main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'vitest.config.ts'
      - 'tsconfig.base.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-scripts-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `@line-crm/shared` の入口 (package.json の main / exports) は dist を
      # 指している。`test:scripts` が読む scripts/verify-staging-operational-path.ts
      # は packages/db/src 経由で shared を読むので、dist が無いと vite が入口を
      # 解決できず、**試験を1件も走らせないまま**読み込みの段階で落ちる。
      #
      # PR は required-pr-gate.yml の `repository-checks` が install の直後に
      # 同じ build を置いているため緑になる。本流に入ってから走るこの workflow
      # だけが落ちていた (#714。2026-09-10 に6回連続で failure)。
      #
      # build するのは shared だけでよい。db や line-sdk まで足さなくても
      # `test:scripts` が緑になること、後段の typecheck は dist 無しでも通ることを、
      # dist を消した状態で実際に走らせて確かめている。
      - name: Build the shared package
        run: pnpm --filter @line-crm/shared build

      - name: Vitest (scripts)
        # Includes the git-backed deploy lock integration tests, which drive
        # real git against a temporary bare repository.
        run: pnpm test:scripts

      - name: TypeScript typecheck (scripts)
        # The root workspace intentionally has no @types/node: adding one
        # rewrites unrelated pnpm-lock entries, because the committed lockfile
        # was produced by a newer pnpm than `packageManager` pins. Installing
        # the types into a throwaway prefix keeps the repository untouched.
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/typedeps" @types/node@22
          pnpm exec tsc -p scripts/tsconfig.json \
            --typeRoots "$RUNNER_TEMP/typedeps/node_modules/@types"

      - name: Shell syntax check
        run: |
          failed=0
          while IFS= read -r script; do
            echo "bash -n $script"
            bash -n "$script" || failed=1
          done < <(find scripts -name '*.sh' -type f)
          exit "$failed"

      - name: Workflow YAML check
        # Parses every workflow and asserts the run steps are valid shell, so a
        # broken heredoc or mis-indented block fails here instead of at 4:17am
        # in the scheduled upstream import.
        run: |
          python3 - <<'PY'
          import glob, subprocess, sys, tempfile, os
          try:
              import yaml
          except ImportError:
              subprocess.run([sys.executable, '-m', 'pip', 'install', '--quiet', 'pyyaml'], check=True)
              import yaml

          failed = False
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  doc = yaml.safe_load(open(path))
              except Exception as exc:
                  print(f'[NG] {path}: YAML parse failed: {exc}')
                  failed = True
                  continue
              print(f'[OK] {path}: YAML parsed')
              for job in (doc.get('jobs') or {}).values():
                  for step in (job.get('steps') or []):
                      run = step.get('run')
                      if not run:
                          continue
                      # GitHub expressions are not shell; blank them out first.
                      import re
                      script = re.sub(r'\$\{\{[^}]*\}\}', 'GH_EXPR', run)
                      with tempfile.NamedTemporaryFile('w', suffix='.sh', delete=False) as fh:
                          fh.write(script)
                          tmp = fh.name
                      proc = subprocess.run(['bash', '-n', tmp], capture_output=True, text=True)
                      os.unlink(tmp)
                      if proc.returncode != 0:
                          name = step.get('name', '(unnamed step)')
                          print(f'[NG] {path} / {name}: {proc.stderr.strip()}')
                          failed = True
          sys.exit(1 if failed else 0)
          PY
