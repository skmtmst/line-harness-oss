name: Deploy Cloudflare Staging

on:
  push:
    branches:
      - codex/development
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run はビルドと設定確認だけ
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - apply
      target:
        description: 反映対象。権限を分けてWorkerまたは管理画面だけにもできます
        type: choice
        required: true
        default: all
        options:
          - all
          - worker
          - admin

permissions:
  contents: write

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository != 'Shudesu/line-harness-oss' &&
      github.ref == 'refs/heads/codex/development' &&
      (github.event_name == 'workflow_dispatch' ||
       vars.NEN_STAGING_DELIVERY_MODE == 'dry-run' ||
       vars.NEN_STAGING_DELIVERY_MODE == 'apply')
    runs-on: ubuntu-latest
    environment: staging
    env:
      DELIVERY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.NEN_STAGING_DELIVERY_MODE }}
      DELIVERY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
      GH_TOKEN: ${{ github.token }}
      WORKER_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      D1_STAGING_DATABASE_NAME: ${{ secrets.D1_STAGING_DATABASE_NAME }}
      STAGING_API_URL: https://nen-line-stg.skmtmst.workers.dev
      STAGING_PAGES_PROJECT: nen-line-stg-admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify staging boundary and deploy lock
        run: |
          test "$GITHUB_REF" = "refs/heads/codex/development"
          test "$DELIVERY_MODE" = "dry-run" -o "$DELIVERY_MODE" = "apply"
          test "$DELIVERY_TARGET" = "all" -o "$DELIVERY_TARGET" = "worker" -o "$DELIVERY_TARGET" = "admin"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          if [ "$DELIVERY_TARGET" != "admin" ]; then
            test -n "$WORKER_API_TOKEN"
          fi
          # Workerを配備しない場合も、apply前のD1整合性確認にはWorker用tokenが要る。
          test -n "$WORKER_API_TOKEN"
          if [ "$DELIVERY_TARGET" != "worker" ]; then
            test -n "$PAGES_API_TOKEN"
          fi
          grep -q '^name = "nen-line-stg"$' apps/worker/wrangler.staging.toml
          grep -q 'database_name = "nen-line-stg"' apps/worker/wrangler.staging.toml
          if grep -q '^\[triggers\]' apps/worker/wrangler.staging.toml; then
            echo "::error::検証Workerでcronが有効です。通知事故を防ぐため中止します。"
            exit 1
          fi

      - name: Count pending staging D1 migrations
        id: pending_migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.WORKER_API_TOKEN }}
        run: |
          db_name="$D1_STAGING_DATABASE_NAME"
          if [ -z "$db_name" ]; then
            db_name=$(grep -A4 'd1_databases' apps/worker/wrangler.staging.toml \
              | grep 'database_name' | head -1 | sed 's/.*= *"//; s/".*//')
          fi
          if [ -z "$db_name" ]; then
            echo "::error::検証用のデータベース名を決められませんでした"
            exit 1
          fi

          applied=$(npx wrangler d1 execute "$db_name" --remote \
            --command "SELECT name FROM _migrations" --json \
            | node -e "
              const d = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
              const rows = d[0]?.results ?? [];
              console.log(rows.map((row) => row.name).join('\n'));
            ")

          pending_file="$RUNNER_TEMP/staging-pending-migrations.txt"
          : > "$pending_file"
          pending_count=0
          for migration in $(ls packages/db/migrations/*.sql | sort); do
            name=$(basename "$migration")
            if ! printf '%s\n' "$applied" | grep -qxF "$name"; then
              printf '%s\n' "$name" >> "$pending_file"
              pending_count=$((pending_count + 1))
            fi
          done
          echo "count=$pending_count" >> "$GITHUB_OUTPUT"
          {
            echo "## 検証D1の未適用マイグレーション: ${pending_count} 件"
            echo
            if [ "$pending_count" -gt 0 ]; then
              echo '```'
              cat "$pending_file"
              echo '```'
            else
              echo "すべて適用済みです。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DELIVERY_MODE" = "apply" ] && [ "$pending_count" -ne 0 ]; then
            echo "::error::検証D1に未適用マイグレーションが ${pending_count} 件あります。Migrate D1を先に実行してください。"
            exit 1
          fi

      - name: Acquire the shared staging lock
        id: staging_lock
        if: env.DELIVERY_MODE == 'apply'
        run: |
          git config user.name "NEN staging delivery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm deploy:lock acquire staging \
            --note "GitHub Actions ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" \
            --remote origin
          pnpm deploy:lock verify staging --sha "$GITHUB_SHA" --remote origin

      - name: Bind the staging Cloudflare account
        run: |
          sed -i -E \
            "s/^account_id[[:space:]]*=.*/account_id = \"$CLOUDFLARE_ACCOUNT_ID\"/" \
            apps/worker/wrangler.staging.toml
          grep -q "^account_id = \"$CLOUDFLARE_ACCOUNT_ID\"$" \
            apps/worker/wrangler.staging.toml

      - name: Build Worker and LIFF assets
        if: env.DELIVERY_TARGET != 'admin'
        run: pnpm --filter worker build

      - name: Check Worker bundle without publishing
        if: env.DELIVERY_MODE == 'dry-run' && env.DELIVERY_TARGET != 'admin'
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.WORKER_API_TOKEN }}
        run: npx wrangler deploy --config apps/worker/wrangler.staging.toml --dry-run

      - name: Deploy Worker to staging
        if: env.DELIVERY_MODE == 'apply' && env.DELIVERY_TARGET != 'admin'
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.WORKER_API_TOKEN }}
        run: npx wrangler deploy --config apps/worker/wrangler.staging.toml

      - name: Build Admin Panel dependencies
        if: env.DELIVERY_TARGET != 'worker'
        run: pnpm --filter @line-harness/update-engine build

      - name: Build Admin Panel for staging
        if: env.DELIVERY_TARGET != 'worker'
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: ${{ env.STAGING_API_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_HQ_TEMPLATE_DISTRIBUTION_ENABLED: '1'
          NEXT_PUBLIC_RESTAURANT_TEST_ENABLED: 'true'

      - name: Deploy Admin Panel to staging
        if: env.DELIVERY_MODE == 'apply' && env.DELIVERY_TARGET != 'worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.PAGES_API_TOKEN }}
        run: |
          npx wrangler pages deploy apps/web/out \
            --project-name "$STAGING_PAGES_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "staging deploy $GITHUB_SHA"

      - name: Summarize
        if: always()
        run: |
          {
            echo "## 検証環境デプロイ"
            echo
            echo "- mode: \`$DELIVERY_MODE\`"
            echo "- target: \`$DELIVERY_TARGET\`"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- Worker: \`nen-line-stg\`"
            echo "- Admin: \`nen-line-stg-admin\`"
            echo "- D1 migration: 未適用 ${{ steps.pending_migrations.outputs.count || '確認失敗' }} 件（このWorkflowでは適用しません）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release the staging lock after successful verification
        if: success() && steps.staging_lock.outcome == 'success'
        run: pnpm deploy:lock release staging --remote origin
