name: Deploy Cloudflare Staging

on:
  push:
    branches:
      - codex/development
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run はビルドと設定確認だけ
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - apply
      target:
        description: 反映対象。権限を分けてWorkerまたは管理画面だけにもできます
        type: choice
        required: true
        default: all
        options:
          - all
          - worker
          - admin
      worker_config_replay:
        description: 未適用D1を避け、現在配備中と同じWorkerコードへ最新の検証設定だけを重ねる
        type: boolean
        required: true
        default: false
      worker_source_sha:
        description: config replayで再利用する、現在配備中Workerの40桁Git SHA
        type: string
        required: false
        default: ''
      expected_worker_version_id:
        description: config replay開始前に一致を確認する、現在配備中WorkerのVersion ID
        type: string
        required: false
        default: ''
      pages_config_replay:
        description: 未適用D1を避け、現在公開中と同じ管理画面コードを新しい検証API URLで再ビルドする
        type: boolean
        required: true
        default: false
      pages_source_sha:
        description: 現在公開中の管理画面の40桁Git SHA
        type: string
        required: false
        default: ''
      expected_pages_deployment_id:
        description: 現在公開中の管理画面のDeployment ID
        type: string
        required: false
        default: ''
      expected_google_business_write_enabled:
        description: 配備後にVersionの実効値を照合する（今回の試験はtrue、戻す時はfalse）
        type: choice
        required: true
        default: skip
        options:
          - skip
          - 'true'
          - 'false'

permissions:
  contents: write

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository != 'Shudesu/line-harness-oss' &&
      github.ref == 'refs/heads/codex/development' &&
      (github.event_name == 'workflow_dispatch' ||
       vars.NEN_STAGING_DELIVERY_MODE == 'dry-run' ||
       vars.NEN_STAGING_DELIVERY_MODE == 'apply')
    runs-on: ubuntu-latest
    environment: staging
    env:
      DELIVERY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.NEN_STAGING_DELIVERY_MODE }}
      DELIVERY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
      WORKER_CONFIG_REPLAY: ${{ github.event_name == 'workflow_dispatch' && inputs.worker_config_replay || false }}
      WORKER_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.worker_source_sha || '' }}
      EXPECTED_WORKER_VERSION_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_worker_version_id || '' }}
      PAGES_CONFIG_REPLAY: ${{ github.event_name == 'workflow_dispatch' && inputs.pages_config_replay || false }}
      PAGES_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.pages_source_sha || '' }}
      EXPECTED_PAGES_DEPLOYMENT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_pages_deployment_id || '' }}
      EXPECTED_GOOGLE_BUSINESS_WRITE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_google_business_write_enabled || 'skip' }}
      GH_TOKEN: ${{ github.token }}
      WORKER_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      D1_STAGING_DATABASE_NAME: ${{ secrets.D1_STAGING_DATABASE_NAME }}
      STAGING_API_URL: https://stg-api.musubo.jp
      STAGING_PAGES_PROJECT: nen-line-stg-admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify staging boundary and deploy lock
        run: |
          test "$GITHUB_REF" = "refs/heads/codex/development"
          test "$DELIVERY_MODE" = "dry-run" -o "$DELIVERY_MODE" = "apply"
          test "$DELIVERY_TARGET" = "all" -o "$DELIVERY_TARGET" = "worker" -o "$DELIVERY_TARGET" = "admin"
          test "$WORKER_CONFIG_REPLAY" != "true" -o "$PAGES_CONFIG_REPLAY" != "true"
          if [ "$PAGES_CONFIG_REPLAY" = "true" ]; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            test "$DELIVERY_TARGET" = "admin"
          fi
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          if [ "$DELIVERY_TARGET" != "admin" ]; then
            test -n "$WORKER_API_TOKEN"
          fi
          # Workerを配備しない場合も、apply前のD1整合性確認にはWorker用tokenが要る。
          test -n "$WORKER_API_TOKEN"
          if [ "$DELIVERY_TARGET" != "worker" ]; then
            test -n "$PAGES_API_TOKEN"
          fi
          grep -q '^name = "nen-line-stg"$' apps/worker/wrangler.staging.toml
          grep -q 'database_name = "nen-line-stg"' apps/worker/wrangler.staging.toml
          if grep -q '^\[triggers\]' apps/worker/wrangler.staging.toml; then
            echo "::error::検証Workerでcronが有効です。通知事故を防ぐため中止します。"
            exit 1
          fi

      - name: Count pending staging D1 migrations
        id: pending_migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.WORKER_API_TOKEN }}
        run: |
          db_name="$D1_STAGING_DATABASE_NAME"
          if [ -z "$db_name" ]; then
            db_name=$(grep -A4 'd1_databases' apps/worker/wrangler.staging.toml \
              | grep 'database_name' | head -1 | sed 's/.*= *"//; s/".*//')
          fi
          if [ -z "$db_name" ]; then
            echo "::error::検証用のデータベース名を決められませんでした"
            exit 1
          fi

          applied=$(npx wrangler d1 execute "$db_name" --remote \
            --command "SELECT name FROM _migrations" --json \
            | node -e "
              const d = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
              const rows = d[0]?.results ?? [];
              console.log(rows.map((row) => row.name).join('\n'));
            ")

          pending_file="$RUNNER_TEMP/staging-pending-migrations.txt"
          : > "$pending_file"
          pending_count=0
          for migration in $(ls packages/db/migrations/*.sql | sort); do
            name=$(basename "$migration")
            if ! printf '%s\n' "$applied" | grep -qxF "$name"; then
              printf '%s\n' "$name" >> "$pending_file"
              pending_count=$((pending_count + 1))
            fi
          done
          echo "count=$pending_count" >> "$GITHUB_OUTPUT"
          {
            echo "## 検証D1の未適用マイグレーション: ${pending_count} 件"
            echo
            if [ "$pending_count" -gt 0 ]; then
              echo '```'
              cat "$pending_file"
              echo '```'
            else
              echo "すべて適用済みです。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DELIVERY_MODE" = "apply" ] && [ "$pending_count" -ne 0 ] && \
            [ "$WORKER_CONFIG_REPLAY" != "true" ] && [ "$PAGES_CONFIG_REPLAY" != "true" ]; then
            echo "::error::検証D1に未適用マイグレーションが ${pending_count} 件あります。Migrate D1を先に実行してください。"
            exit 1
          fi

      - name: Prepare the deployed Worker source for config replay
        id: worker_source
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.WORKER_API_TOKEN }}
        run: |
          worker_root="$GITHUB_WORKSPACE"
          if [ "$WORKER_CONFIG_REPLAY" = "true" ]; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            test "$DELIVERY_TARGET" = "worker"
            printf '%s' "$WORKER_SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
            printf '%s' "$EXPECTED_WORKER_VERSION_ID" | grep -Eq '^[0-9a-f-]{36}$'

            deployments=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nen-line-stg/deployments")
            active_version=$(printf '%s' "$deployments" | jq -r \
              '.result.deployments | max_by(.created_on) | .versions[] | select(.percentage == 100) | .version_id')
            test "$active_version" = "$EXPECTED_WORKER_VERSION_ID"

            git fetch --no-tags --deepen=200 origin codex/development
            git cat-file -e "$WORKER_SOURCE_SHA^{commit}"
            git merge-base --is-ancestor "$WORKER_SOURCE_SHA" "$GITHUB_SHA"
            worker_root="$RUNNER_TEMP/worker-source"
            git worktree add --detach "$worker_root" "$WORKER_SOURCE_SHA"
            cp apps/worker/wrangler.staging.toml "$worker_root/apps/worker/wrangler.staging.toml"
            pnpm --dir "$worker_root" install --frozen-lockfile

            # replay元のWorkerコードを保ち、版管理された検証設定だけを重ねる。
            test -z "$(git -C "$worker_root" status --porcelain -- . ':(exclude)apps/worker/wrangler.staging.toml')"
            test -n "$(git -C "$worker_root" diff -- apps/worker/wrangler.staging.toml)"
          fi
          echo "root=$worker_root" >> "$GITHUB_OUTPUT"

      - name: Prepare the deployed Admin source for config replay
        id: admin_source
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.PAGES_API_TOKEN }}
        run: |
          admin_root="$GITHUB_WORKSPACE"
          if [ "$PAGES_CONFIG_REPLAY" = "true" ]; then
            printf '%s' "$PAGES_SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
            printf '%s' "$EXPECTED_PAGES_DEPLOYMENT_ID" | grep -Eq '^[0-9a-f-]{36}$'

            project=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$STAGING_PAGES_PROJECT")
            active_id=$(printf '%s' "$project" | jq -r '.result.canonical_deployment.id')
            active_sha=$(printf '%s' "$project" | jq -r '.result.canonical_deployment.deployment_trigger.metadata.commit_hash')
            test "$active_id" = "$EXPECTED_PAGES_DEPLOYMENT_ID"
            test "$active_sha" = "$PAGES_SOURCE_SHA"

            git fetch --no-tags --deepen=200 origin codex/development
            git cat-file -e "$PAGES_SOURCE_SHA^{commit}"
            git merge-base --is-ancestor "$PAGES_SOURCE_SHA" "$GITHUB_SHA"
            admin_root="$RUNNER_TEMP/admin-source"
            git worktree add --detach "$admin_root" "$PAGES_SOURCE_SHA"
            pnpm --dir "$admin_root" install --frozen-lockfile
            test -z "$(git -C "$admin_root" status --porcelain)"
          fi
          echo "root=$admin_root" >> "$GITHUB_OUTPUT"

      - name: Acquire the shared staging lock
        id: staging_lock
        if: env.DELIVERY_MODE == 'apply'
        run: |
          git config user.name "NEN staging delivery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm deploy:lock acquire staging \
            --note "GitHub Actions ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" \
            --remote origin
          pnpm deploy:lock verify staging --sha "$GITHUB_SHA" --remote origin

      - name: Bind the staging Cloudflare account
        run: |
          worker_root="${{ steps.worker_source.outputs.root }}"
          sed -i -E \
            "s/^account_id[[:space:]]*=.*/account_id = \"$CLOUDFLARE_ACCOUNT_ID\"/" \
            "$worker_root/apps/worker/wrangler.staging.toml"
          grep -q "^account_id = \"$CLOUDFLARE_ACCOUNT_ID\"$" \
            "$worker_root/apps/worker/wrangler.staging.toml"

      - name: Build Worker and LIFF assets
        if: env.DELIVERY_TARGET != 'admin'
        run: |
          cd "${{ steps.worker_source.outputs.root }}"
          pnpm --filter worker build

      - name: Check Worker bundle without publishing
        if: env.DELIVERY_MODE == 'dry-run' && env.DELIVERY_TARGET != 'admin'
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.WORKER_API_TOKEN }}
        run: |
          cd "${{ steps.worker_source.outputs.root }}"
          npx wrangler deploy --config apps/worker/wrangler.staging.toml --dry-run

      - name: Deploy Worker to staging
        id: worker_deploy
        if: env.DELIVERY_MODE == 'apply' && env.DELIVERY_TARGET != 'admin'
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.WORKER_API_TOKEN }}
        run: |
          set -o pipefail
          cd "${{ steps.worker_source.outputs.root }}"
          if [ "$WORKER_CONFIG_REPLAY" = "true" ]; then
            npx wrangler deploy --config apps/worker/wrangler.staging.toml \
              --message "staging config replay from $WORKER_SOURCE_SHA" 2>&1 \
              | tee "$RUNNER_TEMP/worker-deploy.log"
          else
            npx wrangler deploy --config apps/worker/wrangler.staging.toml 2>&1 \
              | tee "$RUNNER_TEMP/worker-deploy.log"
          fi
          version_id=$(sed -n 's/.*Current Version ID: //p' "$RUNNER_TEMP/worker-deploy.log" | tail -1)
          printf '%s' "$version_id" | grep -Eq '^[0-9a-f-]{36}$'
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Verify the deployed Worker version and Google write setting
        if: env.DELIVERY_MODE == 'apply' && env.DELIVERY_TARGET != 'admin'
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.WORKER_API_TOKEN }}
        run: |
          version_id="${{ steps.worker_deploy.outputs.version_id }}"
          version=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nen-line-stg/versions/$version_id")
          active=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nen-line-stg/deployments")
          active_version=$(printf '%s' "$active" | jq -r \
            '.result.deployments | max_by(.created_on) | .versions[] | select(.percentage == 100) | .version_id')
          test "$active_version" = "$version_id"

          if [ "$EXPECTED_GOOGLE_BUSINESS_WRITE_ENABLED" != "skip" ]; then
            actual=$(printf '%s' "$version" | jq -r \
              '.result.resources.bindings[] | select(.name == "GOOGLE_BUSINESS_WRITE_ENABLED") | .text')
            test "$actual" = "$EXPECTED_GOOGLE_BUSINESS_WRITE_ENABLED"
            echo "GOOGLE_BUSINESS_WRITE_ENABLED=$actual" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Admin Panel dependencies
        if: env.DELIVERY_TARGET != 'worker'
        run: |
          cd "${{ steps.admin_source.outputs.root }}"
          pnpm --filter @line-harness/update-engine build

      - name: Build Admin Panel for staging
        if: env.DELIVERY_TARGET != 'worker'
        run: |
          cd "${{ steps.admin_source.outputs.root }}"
          pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: ${{ env.STAGING_API_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_HQ_TEMPLATE_DISTRIBUTION_ENABLED: '1'
          NEXT_PUBLIC_RESTAURANT_TEST_ENABLED: 'true'
          # G6 移し替え：検証環境の開いたときの見た目は V8。本番は付けない（v7 のまま）。
          NEXT_PUBLIC_ADMIN_THEME: 'v8'
          # リリース前点検：ログイン前の規約・方針・表記・お問い合わせの公開先（秘密ではない）。
          # 本番の配備（deploy-cloudflare-admin.yml）には切り替えのときに同じ4つを足す。
          NEXT_PUBLIC_TERMS_URL: 'https://musubo.jp/terms/'
          NEXT_PUBLIC_PRIVACY_URL: 'https://musubo.jp/privacy/'
          NEXT_PUBLIC_COMMERCE_LAW_URL: 'https://musubo.jp/legal/'
          NEXT_PUBLIC_CONTACT_URL: 'https://musubo.jp/contact/'

      - name: Deploy Admin Panel to staging
        if: env.DELIVERY_MODE == 'apply' && env.DELIVERY_TARGET != 'worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.PAGES_API_TOKEN }}
        run: |
          cd "${{ steps.admin_source.outputs.root }}"
          source_sha="$GITHUB_SHA"
          if [ "$PAGES_CONFIG_REPLAY" = "true" ]; then
            source_sha="$PAGES_SOURCE_SHA"
          fi
          npx wrangler pages deploy apps/web/out \
            --project-name "$STAGING_PAGES_PROJECT" \
            --branch main \
            --commit-hash "$source_sha" \
            --commit-message "staging API URL config replay from $source_sha"

          # Pagesのcanonical反映はアップロード完了より少し遅れることがある。
          # 再配備はせず、読み取りだけで反映を待つ。
          for attempt in {1..15}; do
            project=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$STAGING_PAGES_PROJECT")
            deployed_id=$(printf '%s' "$project" | jq -r '.result.canonical_deployment.id')
            deployed_sha=$(printf '%s' "$project" | jq -r '.result.canonical_deployment.deployment_trigger.metadata.commit_hash')
            if [ "$deployed_sha" = "$source_sha" ] && \
              { [ "$PAGES_CONFIG_REPLAY" != "true" ] || [ "$deployed_id" != "$EXPECTED_PAGES_DEPLOYMENT_ID" ]; }; then
              break
            fi
            sleep 2
          done
          test "$deployed_sha" = "$source_sha"
          if [ "$PAGES_CONFIG_REPLAY" = "true" ]; then
            test "$deployed_id" != "$EXPECTED_PAGES_DEPLOYMENT_ID"
          fi
          echo "Admin Deployment ID: $deployed_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize
        if: always()
        run: |
          {
            echo "## 検証環境デプロイ"
            echo
            echo "- mode: \`$DELIVERY_MODE\`"
            echo "- target: \`$DELIVERY_TARGET\`"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- Worker: \`nen-line-stg\`"
            echo "- Worker Version ID: \`${{ steps.worker_deploy.outputs.version_id || '未配備' }}\`"
            echo "- Worker config replay: \`$WORKER_CONFIG_REPLAY\`"
            echo "- Admin: \`nen-line-stg-admin\`"
            echo "- Admin config replay: \`$PAGES_CONFIG_REPLAY\` (source: \`${PAGES_SOURCE_SHA:-$GITHUB_SHA}\`)"
            echo "- D1 migration: 未適用 ${{ steps.pending_migrations.outputs.count || '確認失敗' }} 件（このWorkflowでは適用しません）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release the staging lock after successful verification
        if: success() && steps.staging_lock.outcome == 'success'
        run: pnpm deploy:lock release staging --remote origin
