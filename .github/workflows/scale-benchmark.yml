name: Scale Benchmark

# 友だち 5 万人・タグ 200・トーク 10 万件の作り物のデータで、管理画面が最初に呼ぶ口の速さを測る。
# 報告だけ（job summary に表を出す）。目安 3 秒を超えても落とさない。required-pr-gate には入れない。
# ローカルの使い捨て D1（Miniflare）だけを使い、検証・本番の DB や秘密値には触らない。
on:
  schedule:
    # 毎週月曜 03:00（日本時間）
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      slow_control:
        description: 'タグの一覧にわざと重い処理を足す対照の回にする'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scale-benchmark
  cancel-in-progress: false

jobs:
  scale-benchmark:
    name: Large data speed (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @line-harness/sdk --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-crm/db build

      - name: Measure large data speed
        # 遅いことは失敗にしない。台本そのものが壊れた時（行が入らない・口が 500）だけ赤くなる。
        env:
          SCALE_RUNS: '5'
          SCALE_THRESHOLD_MS: '3000'
          SCALE_SEED: '20261025'
          SCALE_SUMMARY: ${{ github.workspace }}/scale-benchmark.md
          SCALE_JSON: ${{ github.workspace }}/scale-benchmark.json
          SCALE_SLOW_CONTROL: ${{ inputs.slow_control && '1' || '' }}
        run: pnpm --filter worker scale:benchmark

      - name: Write job summary
        if: always()
        run: |
          if [ -f scale-benchmark.md ]; then
            cat scale-benchmark.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '大きいデータの速度の表を作れませんでした。上の手順の記録を見てください。' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scale-benchmark
          path: |
            scale-benchmark.md
            scale-benchmark.json
          if-no-files-found: ignore
          retention-days: 30
