name: Configure AI Loop Slack Reports

on:
  workflow_dispatch:
    inputs:
      mode:
        description: verify は名前だけ確認、apply は検証Workerへ暗号化設定
        type: choice
        required: true
        default: verify
        options:
          - verify
          - apply

permissions:
  contents: read

concurrency:
  group: ai-loop-slack-report-staging
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/codex/development'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      AI_LOOP_SLACK_REPORT_SECRET: ${{ secrets.AI_LOOP_SLACK_REPORT_SECRET }}
      SLACK_AI_LOOP_CHANNEL_ID: ${{ secrets.SLACK_AI_LOOP_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify the staging-only boundary
        run: |
          test "$GITHUB_REF" = "refs/heads/codex/development"
          test "${{ inputs.mode }}" = "verify" -o "${{ inputs.mode }}" = "apply"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -q '^name = "nen-line-stg"$' apps/worker/wrangler.staging.toml
          grep -q 'database_name = "nen-line-stg"' apps/worker/wrangler.staging.toml
          if grep -q '^\[triggers\]' apps/worker/wrangler.staging.toml; then
            echo "::error::検証Workerでcronが有効です。外部送信事故を防ぐため中止します。"
            exit 1
          fi

      - name: Bind the staging Cloudflare account
        run: |
          sed -i -E \
            "s/^account_id[[:space:]]*=.*/account_id = \"$CLOUDFLARE_ACCOUNT_ID\"/" \
            apps/worker/wrangler.staging.toml

      - name: Verify GitHub secrets before apply
        if: inputs.mode == 'apply'
        run: |
          test -n "$AI_LOOP_SLACK_REPORT_SECRET"
          test -n "$SLACK_AI_LOOP_CHANNEL_ID"

      - name: Create an ephemeral secret bundle
        if: inputs.mode == 'apply'
        env:
          SECRET_FILE: ${{ runner.temp }}/ai-loop-slack-report-secrets.json
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync(
            process.env.SECRET_FILE,
            JSON.stringify({
              AI_LOOP_SLACK_REPORT_SECRET: process.env.AI_LOOP_SLACK_REPORT_SECRET,
              SLACK_AI_LOOP_CHANNEL_ID: process.env.SLACK_AI_LOOP_CHANNEL_ID,
            }),
            { mode: 0o600 },
          );
          NODE

      - name: Upload both report-only secrets in one request
        if: inputs.mode == 'apply'
        env:
          SECRET_FILE: ${{ runner.temp }}/ai-loop-slack-report-secrets.json
        run: pnpm exec wrangler secret bulk "$SECRET_FILE" --config apps/worker/wrangler.staging.toml

      - name: Remove the ephemeral secret bundle
        if: always()
        run: rm -f "$RUNNER_TEMP/ai-loop-slack-report-secrets.json"

      - name: Verify secret names without reading values
        run: |
          secret_list="$RUNNER_TEMP/ai-loop-slack-report-secret-names.json"
          pnpm exec wrangler secret list \
            --config apps/worker/wrangler.staging.toml \
            --format json > "$secret_list"
          node - "$secret_list" <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const names = new Set(rows.map((row) => row.name));
          const required = ['AI_LOOP_SLACK_REPORT_SECRET', 'SLACK_AI_LOOP_CHANNEL_ID'];
          const missing = required.filter((name) => !names.has(name));
          if (missing.length > 0) {
            console.error(`Missing report-only secret names: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log('Report-only secret names are configured. Values were not read.');
          NODE

      - name: Summarize
        if: always()
        run: |
          {
            echo '## AI開発 Slack報告専用設定'
            echo
            echo '- environment: `staging`'
            echo '- worker: `nen-line-stg`'
            echo '- direction: `cloud -> Slack only`'
            echo '- Slack input, command, approval: `disabled`'
            echo '- secret values: `not displayed`'
          } >> "$GITHUB_STEP_SUMMARY"
